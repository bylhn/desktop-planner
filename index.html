<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Desktop Planner</title>
<style>
  :root {
    --bg-a: 0.55;
    --ink: #2b2b33;
    --ink-soft: #6b6b78;
    --line: rgba(60, 60, 80, 0.12);
    --panel: rgba(255, 255, 255, 0.35);
    --chip: rgba(255, 255, 255, 0.55);
    --accent: #6b5cff;
    --accent-rgb: 107, 92, 255;
    --sun: #e5484d;
    --sat: #2f7cf6;
    --done: #9a9aa6;
    --base: 255, 255, 255;
  }
  body.dark {
    --ink: #f2f2f6;
    --ink-soft: #b9b9c6;
    --line: rgba(255, 255, 255, 0.14);
    --panel: rgba(20, 20, 30, 0.35);
    --chip: rgba(40, 40, 55, 0.55);
    --accent: #a89bff;
    --accent-rgb: 168, 155, 255;
    --sun: #ff7b7f;
    --sat: #7fb0ff;
    --done: #8a8a98;
    --base: 18, 18, 26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body {
    font-family: "Pretendard", "Segoe UI Variable", "Malgun Gothic", sans-serif;
    font-size: 13px; color: var(--ink);
    user-select: none; overflow: hidden;
    display: flex; flex-direction: column;
    position: relative; border-radius: 16px; isolation: isolate;
  }
  #wall { position: fixed; z-index: -2; pointer-events: none; background-size: cover; background-position: center; filter: blur(14px) saturate(1.1); }
  body.noblur #wall { display: none; }
  #tint {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: rgba(var(--base), var(--bg-a)); border-radius: 16px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.35);
  }
  body.unlocked #tint { box-shadow: inset 0 0 0 2px var(--accent); }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- header ---------- */
  header { display: flex; align-items: center; gap: 6px; padding: 14px 18px 8px 22px; }
  body.unlocked header { -webkit-app-region: drag; cursor: move; }
  header button, header input, .pop, .dash { -webkit-app-region: no-drag; }
  .title { font-size: 17px; font-weight: 700; margin: 0 4px; min-width: 150px; text-align: center; }
  .icon-btn { width: 30px; height: 30px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--chip); }
  .icon-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .spacer { flex: 1; }
  .seg { display: flex; background: var(--chip); border-radius: 9px; padding: 2px; }
  .seg button { padding: 4px 12px; border-radius: 7px; color: var(--ink-soft); }
  .seg button.on { background: rgba(var(--base), 0.9); color: var(--accent); }
  .pill { padding: 5px 11px; border-radius: 8px; background: var(--chip); font-size: 12px; }
  .lock-on { color: var(--accent); }

  main { flex: 1; display: flex; min-height: 0; padding: 0 14px 14px 16px; gap: 12px; position: relative; }

  /* ---------- today (checklist) ---------- */
  .today { flex: 1; min-width: 0; display: flex; flex-direction: column; background: var(--panel); border-radius: 14px; padding: 16px 18px 12px; }
  .summary { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; }
  .ring { width: 64px; height: 64px; flex: none; }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .bg { stroke: var(--line); }
  .ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .35s; transform: rotate(-90deg); transform-origin: 50% 50%; }
  .ring text { font-size: 15px; font-weight: 700; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .sum-text b { font-size: 16px; display: block; margin-bottom: 3px; }
  .sum-text span { color: var(--ink-soft); font-size: 12.5px; }
  .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col .scroll { flex: 1; overflow-y: auto; margin: 0 -6px; padding: 0 6px; }
  .sec { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 6px; }
  .sec h3 { margin: 0; font-size: 13.5px; font-weight: 700; }
  .sec h3 small { font-weight: 500; color: var(--ink-soft); margin-left: 6px; font-size: 12px; }
  .sec .link { font-size: 12px; color: var(--accent); }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-bottom: 6px; }
  .bar div { height: 100%; background: var(--accent); transition: width .25s; }

  .item { display: flex; align-items: center; gap: 9px; padding: 7px 6px; border-radius: 9px; }
  .item:hover { background: rgba(var(--base), 0.4); }
  .check { width: 19px; height: 19px; border-radius: 6px; flex: none; border: 1.6px solid var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; transition: background .15s, border-color .15s; }
  .check.round { border-radius: 50%; }
  .check svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3; fill: none; opacity: 0; }
  .item.done .check { background: var(--accent); border-color: var(--accent); }
  .item.done .check svg { opacity: 1; }
  .item .time { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--accent); background: rgba(var(--accent-rgb), 0.12); padding: 1px 6px; border-radius: 6px; flex: none; }
  .item .txt { flex: 1; min-width: 0; word-break: break-all; cursor: text; font-size: 13.5px; }
  .item.done .txt { text-decoration: line-through; color: var(--done); }
  .item.done .time { opacity: .5; }
  .item .days { font-size: 10.5px; color: var(--ink-soft); flex: none; }
  .item .del { opacity: 0; color: var(--ink-soft); width: 22px; height: 22px; border-radius: 6px; flex: none; }
  .item:hover .del { opacity: 1; }
  .item .del:hover { background: var(--chip); color: var(--sun); }
  .item input.edit { flex: 1; border: 0; outline: 0; background: rgba(var(--base), 0.7); border-radius: 6px; padding: 2px 6px; }
  .empty { color: var(--ink-soft); font-size: 12px; padding: 6px; }

  .adder { display: flex; gap: 6px; margin-top: 8px; }
  .adder input { flex: 1; min-width: 0; border: 0; outline: 0; background: rgba(var(--base), 0.6); border-radius: 9px; padding: 8px 10px; }
  .adder input::placeholder { color: var(--ink-soft); }
  .adder button { padding: 0 12px; border-radius: 9px; background: var(--accent); color: #fff; font-weight: 600; }
  .daypick { display: flex; gap: 3px; margin-top: 6px; }
  .daypick button { flex: 1; padding: 4px 0; border-radius: 7px; background: var(--chip); font-size: 11.5px; color: var(--ink-soft); }
  .daypick button.on { background: var(--accent); color: #fff; }
  .hint { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

  /* ---------- side: mini calendar ---------- */
  :root { --side-w: 270px; }
  aside { width: var(--side-w); flex: none; background: var(--panel); border-radius: 14px; padding: 14px 14px 12px; display: flex; flex-direction: column; }
  .mhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .mhead b { font-size: 14px; }
  .mhead .icon-btn { width: 26px; height: 26px; }
  .mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; flex: none; }
  .legend { flex: none; }
  @media (max-width: 900px) {
    .cols { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 8px; }
    .cols .col:first-child .scroll { max-height: 40vh; }
    :root { --side-w: 230px; }
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .two { grid-template-columns: 1fr; }
  }
  .mgrid .dw { text-align: center; font-size: 11px; color: var(--ink-soft); padding: 2px 0 4px; }
  .mgrid .dw.sun { color: var(--sun); } .mgrid .dw.sat { color: var(--sat); }
  .md { height: 30px; min-width: 0; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; position: relative; }
  .md:hover { box-shadow: inset 0 0 0 1px var(--accent); }
  .md.other { opacity: .35; }
  .md.today { font-weight: 800; box-shadow: inset 0 0 0 2px var(--accent); }
  .md.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .md.full::after { content: ''; position: absolute; bottom: 4px; width: 4px; height: 4px; border-radius: 2px; background: #fff; }
  .legend { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--ink-soft); margin-top: 10px; justify-content: flex-end; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .upnext { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; flex: 1; min-height: 0; overflow-y: auto; }
  .upnext h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--ink-soft); font-weight: 600; }
  .up { font-size: 12.5px; padding: 3px 0; display: flex; gap: 6px; }
  .up span:first-child { color: var(--ink-soft); flex: none; width: 66px; white-space: nowrap; }
  .up .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }

  .dtoggle { display: flex; align-items: center; justify-content: space-between; width: 100%; margin-top: 10px; padding: 9px 10px; border-radius: 10px; background: var(--chip); font-size: 12.5px; font-weight: 600; flex: none; }
  .dtoggle:hover { background: rgba(var(--base), 0.75); }
  .sw { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: background .2s; }
  .sw i { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
  .dtoggle.on .sw { background: var(--accent); }
  .dtoggle.on .sw i { transform: translateX(14px); }

  /* ---------- month view ---------- */
  .month { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .dow { display: grid; grid-template-columns: repeat(7, 1fr); padding: 4px 0 6px; }
  .dow div { text-align: center; font-size: 12px; color: var(--ink-soft); }
  .dow .sun { color: var(--sun); } .dow .sat { color: var(--sat); }
  .grid { flex: 1; display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: 1fr; min-height: 0; }
  .cell { border-top: 1px solid var(--line); padding: 5px 6px 4px; min-height: 0; overflow: hidden; border-radius: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
  .cell:hover { background: rgba(var(--base), 0.3); }
  .cell.other .num { opacity: 0.4; }
  .cell .top { display: flex; align-items: center; justify-content: space-between; }
  .num { font-size: 12px; width: 24px; height: 22px; line-height: 22px; text-align: center; border-radius: 11px; }
  .cell.sun .num { color: var(--sun); } .cell.sat .num { color: var(--sat); }
  .cell.today .num { background: var(--accent); color: #fff; font-weight: 700; }
  .pct { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: var(--chip); color: var(--ink-soft); }
  .pct.full { background: var(--accent); color: #fff; }
  .mini { display: flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; }
  .mini .b { width: 3px; align-self: stretch; border-radius: 2px; background: var(--accent); flex: none; }
  .mini span { overflow: hidden; text-overflow: ellipsis; }
  .mini.done span { text-decoration: line-through; color: var(--done); }
  .mini.done .b { background: var(--done); }
  .more { font-size: 10.5px; color: var(--ink-soft); padding-left: 7px; }

  /* ---------- popover ---------- */
  .calrow { display: flex; align-items: center; gap: 7px; padding: 5px 6px; border-radius: 8px; background: var(--chip); margin-bottom: 4px; font-size: 12px; }
  .calrow .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .calrow .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calrow .st { font-size: 10.5px; color: var(--ink-soft); flex: none; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .calrow .st.err { color: var(--sun); }
  .calrow button { width: 20px; height: 20px; border-radius: 5px; color: var(--ink-soft); flex: none; }
  .calrow button:hover { color: var(--sun); background: rgba(var(--base), .6); }
  .calrow .txtbtn { width: auto; padding: 0 7px; height: 22px; font-size: 11px; color: var(--ink); background: rgba(var(--base), .6); }
  .calrow .txtbtn:hover { color: var(--accent); }
  .gbtn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 8px; border-radius: 9px; background: #fff; color: #333; font-weight: 600; font-size: 12.5px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }
  .gbtn:hover { box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .gbtn svg { width: 16px; height: 16px; }
  .gcal { display: flex; align-items: center; gap: 7px; padding: 3px 6px; font-size: 12px; cursor: pointer; border-radius: 6px; }
  .gcal:hover { background: var(--chip); }
  .gcal input { accent-color: var(--accent); margin: 0; }
  .gcal .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .gcal span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev { display: flex; align-items: center; gap: 8px; padding: 6px 6px; font-size: 13px; }
  .ev .cb { width: 4px; align-self: stretch; border-radius: 2px; flex: none; }
  .ev .et { font-size: 11.5px; color: var(--ink-soft); font-variant-numeric: tabular-nums; flex: none; min-width: 76px; }
  .ev .en { flex: 1; min-width: 0; word-break: break-all; }
  .ev.past { opacity: .5; }
  .pop { max-height: calc(100vh - 64px); overflow-y: auto; }
  .pop { position: absolute; top: 50px; right: 18px; z-index: 20; width: 290px; padding: 14px; background: rgba(var(--base), 0.94); border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.18); display: none; }
  .pop.open { display: block; }
  .pop label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; }
  .pop label:first-child { margin-top: 0; }
  .pop input[type=range] { width: 100%; accent-color: var(--accent); }
  .pop input[type=text] { width: 100%; border: 0; outline: 0; background: var(--chip); border-radius: 8px; padding: 7px 9px; }
  .pop .row { display: flex; gap: 6px; }
  .pop .row button, .pop .wide { flex: 1; padding: 7px; border-radius: 8px; background: var(--chip); font-size: 12px; }
  .pop .row button.on { background: var(--accent); color: #fff; }
  .pop .wide { width: 100%; margin-top: 4px; }

  /* ---------- about + help ---------- */
  .about { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); text-align: center; }
  .about .ver { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }
  .about .links { font-size: 11.5px; margin-top: 4px; color: var(--ink-soft); }
  .about a, .mfoot a { color: var(--accent); text-decoration: none; }
  .about a:hover, .mfoot a:hover { text-decoration: underline; }
  .modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0, 0, 0, .18); border-radius: 16px; -webkit-app-region: no-drag; }
  .mcard { width: min(560px, calc(100% - 40px)); max-height: calc(100% - 40px); overflow-y: auto; background: rgba(var(--base), .97); border-radius: 16px; padding: 22px 24px 18px; box-shadow: 0 16px 50px rgba(0, 0, 0, .22); animation: pop .2s ease-out; }
  .mhead2 { display: flex; align-items: center; justify-content: space-between; }
  .mhead2 h2 { margin: 0; font-size: 19px; }
  .msub { color: var(--ink-soft); margin: 4px 0 14px; font-size: 12.5px; }
  .tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .tips li { display: flex; gap: 12px; align-items: flex-start; background: var(--chip); border-radius: 12px; padding: 11px 13px; }
  .tips .ic { font-size: 20px; line-height: 1; flex: none; margin-top: 1px; }
  .tips b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .tips span { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .tips code { background: rgba(var(--accent-rgb), .12); color: var(--accent); padding: 0 5px; border-radius: 5px; font-family: inherit; }
  .mfoot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 12.5px; }
  .mbtn { padding: 9px 20px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 700; }

  /* ---------- dashboard (hidden, opened by keyword) ---------- */
  .dash { position: absolute; inset: 0 calc(var(--side-w) + 26px) 14px 16px; z-index: 15; background: rgba(var(--base), 0.97); border-radius: 14px; padding: 18px 22px; overflow-y: auto; display: none; }
  .dash.open { display: block; animation: pop .2s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .dash-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .dash-head h2 { margin: 0; font-size: 18px; }
  .dash-head small { color: var(--ink-soft); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--chip); border-radius: 12px; padding: 12px 14px; }
  .tile span { font-size: 12px; color: var(--ink-soft); }
  .tile b { display: block; font-size: 24px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tile b small { font-size: 13px; font-weight: 500; color: var(--ink-soft); margin-left: 2px; }
  .card { background: var(--chip); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; }
  .card svg text { fill: var(--ink-soft); font-size: 10px; }
  .two { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; }
  .heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; }
  .heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--line); }
  .rrow { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; margin-bottom: 7px; }
  .rrow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rrow .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .rrow .track div { height: 100%; background: var(--accent); border-radius: 4px; }
  .rrow .v { text-align: right; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .tip { position: fixed; pointer-events: none; background: rgba(20,20,30,.9); color: #fff; font-size: 11.5px; padding: 4px 8px; border-radius: 6px; z-index: 30; display: none; white-space: nowrap; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
</style>
</head>
<body>
<div id="wall"></div>
<div id="tint"></div>
<div class="tip" id="tip"></div>

<header>
  <button class="icon-btn" id="prev" data-i18n-title="prev"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
  <div class="title" id="title"></div>
  <button class="icon-btn" id="next" data-i18n-title="next"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="pill" id="goToday" data-i18n="today"></button>
  <div class="spacer"></div>
  <div class="seg"><button id="vDay" class="on" data-i18n="viewDay"></button><button id="vMonth" data-i18n="viewMonth"></button></div>
  <button class="icon-btn" id="lockBtn"></button>
  <button class="icon-btn" id="setBtn" data-i18n-title="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<div class="pop" id="pop">
  <label data-i18n="language"></label>
  <div class="row"><button id="langKo">한국어</button><button id="langEn">English</button></div>
  <label data-i18n="opacity"></label>
  <input type="range" id="opacity" min="0" max="0.9" step="0.05">
  <label data-i18n="inkColor"></label>
  <div class="row"><button id="lightInk" data-i18n="inkDark"></button><button id="darkInk" data-i18n="inkLight"></button></div>
  <label data-i18n="blur"></label>

const pad = (n) => String(n).padStart(2, '0');
const keyOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* "07:00 기상" / "7시 기상" / "14:30 회의" → { time: '07:00', text: '기상' } */
function splitTime(raw) {
  const s = raw.trim();
  let m = s.match(/^(\d{1,2}):(\d{2})\s+(.+)$/);
  if (m && +m[1] < 24 && +m[2] < 60) return { time: `${pad(+m[1])}:${m[2]}`, text: m[3].trim() };
  m = s.match(/^(\d{1,2})시(?:\s*(\d{1,2})분)?\s+(.+)$/);
  if (m && +m[1] < 24) return { time: `${pad(+m[1])}:${pad(+(m[2] || 0))}`, text: m[3].trim() };
  m = s.match(/^(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s+(.+)$/i); // "7am Gym" / "2:30pm Meeting"
  if (m && +m[1] >= 1 && +m[1] <= 12 && +(m[2] || 0) < 60) {
    const h = (+m[1] % 12) + (m[3].toLowerCase() === 'pm' ? 12 : 0);
    return { time: `${pad(h)}:${pad(+(m[2] || 0))}`, text: m[4].trim() };
  }
  return { time: '', text: s };
}
const byTime = (a, b) => (a.time || '99') < (b.time || '99') ? -1 : (a.time || '99') > (b.time || '99') ? 1 : 0;

/* ---------- state ---------- */
let todos = {};          // { 'YYYY-MM-DD': [{id, text, time, done}] }
let routines = [];       // [{id, text, time, days:[0..6], createdAt, deletedAt}]
let routineDone = {};    // { 'YYYY-MM-DD': [routineId] }
let settings = {};
let today = keyOf(new Date());
let selected = today;
let miniMonth = new Date();
let bigMonth = new Date();
let view = 'day';
let editingRoutines = false;
let newRoutineDays = [];

/* ---------- calendar feeds (read-only) ---------- */
const CAL_COLORS = ['#2f7cf6', '#e5484d', '#30a46c', '#f76b15', '#8e4ec6', '#d6409f', '#12a594'];
let calEvents = [], calStatus = {}, evByDate = new Map(), calMeta = {}, gInfo = {}, gBusy = '';
const calColor = (id) => (calMeta[id] && calMeta[id].color) || ((settings.calendars || []).find((c) => c.id === id) || {}).color || '#888';
const G_LOGO = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.5 5.8c4.4-4 6.8-10 6.8-17.3z"/><path fill="#FBBC05" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';
function renderGoogle() {
  const box = $('gBox');
  const err = gInfo.error === 'no-client' ? t('gNoClient') : gInfo.error === 'expired' ? t('gExpired') : gInfo.error === 'timeout' ? t('gTimeout') : gInfo.error;
  if (!gInfo.connected) {
    box.innerHTML = `<button class="gbtn" id="gLogin"${gBusy ? ' disabled' : ''}>${G_LOGO}${gBusy === 'login' ? t('gWaiting') : t('gLogin')}</button>
      <div class="hint${err ? '' : ''}" style="${err ? 'color:var(--sun)' : ''}">${esc(err || t('gLoginHint'))}</div>`;
    $('gLogin').onclick = async () => {
      gBusy = 'login'; renderGoogle();
      try { setCalendar(await window.planner.googleLogin()); } finally { gBusy = ''; render(); }
    };
    return;
  }
  box.innerHTML = `<div class="calrow"><i class="dot" style="background:#30a46c"></i><span class="nm">${esc(gInfo.email || 'Google')}</span>
      <button class="txtbtn" id="gSync">${gBusy === 'sync' ? '…' : '↻ ' + t('gSync')}</button><button class="txtbtn" id="gOut">${t('gLogout')}</button></div>
    ${err ? `<div class="hint" style="color:var(--sun)">${esc(err)}</div>` : ''}
    ${(gInfo.calendars || []).length ? `<div class="hint" style="margin:6px 0 2px">${t('gShowCals')}</div>` : ''}
    ${(gInfo.calendars || []).map((c) => `<label class="gcal"><input type="checkbox" data-gid="${esc(c.id)}"${c.enabled ? ' checked' : ''}><i class="dot" style="background:${esc(c.color)}"></i><span>${esc(c.name)}</span></label>`).join('')}`;
  $('gSync').onclick = async () => { gBusy = 'sync'; renderGoogle(); try { setCalendar(await window.planner.calendarRefresh()); $('calMsg').textContent = gInfo.error ? '' : t('gSynced'); } finally { gBusy = ''; render(); } };
  $('gOut').onclick = async () => { gBusy = 'out'; try { setCalendar(await window.planner.googleLogout()); } finally { gBusy = ''; render(); } };
  box.querySelectorAll('[data-gid]').forEach((cb) => cb.onchange = async () => { setCalendar(await window.planner.googleToggle(cb.dataset.gid, cb.checked)); render(); });
}
function setCalendar(p) {
  calEvents = p.events || []; calStatus = p.status || {}; calMeta = p.meta || {}; gInfo = p.google || {};
  evByDate = new Map();
  for (const e of calEvents) { if (!evByDate.has(e.date)) evByDate.set(e.date, []); evByDate.get(e.date).push(e); }
  for (const list of evByDate.values()) list.sort((a, b) => (a.allDay ? '' : a.time).localeCompare(b.allDay ? '' : b.time));
}
const eventsOn = (k) => evByDate.get(k) || [];
const evTime = (e) => e.allDay ? t('allDay') : e.time + (e.endTime ? `–${e.endTime}` : '');

function renderCalSettings() {
  const cals = settings.calendars || [];
  $('calList').innerHTML = cals.map((c) => {
    const st = calStatus[c.id];
    const txt = !st ? t('calLoading') : st.ok ? t('calCount', st.count) : t('calError', st.error);
    return `<div class="calrow" title="${esc(st && !st.ok ? st.error : c.url)}"><i class="dot" style="background:${c.color}"></i><span class="nm">${esc(c.name)}</span><span class="st${st && !st.ok ? ' err' : ''}">${esc(txt)}</span><button data-del="${c.id}" title="${t('calRemove')}">✕</button></div>`;
  }).join('');
  $('calList').querySelectorAll('[data-del]').forEach((b) => b.onclick = async () => {
    settings.calendars = (settings.calendars || []).filter((c) => c.id !== b.dataset.del);
    persist(); setCalendar(await window.planner.calendarRefresh()); render();
  });
}
async function addCalendar() {
  const url = $('calUrl').value.trim();
  if (!/^(https?|webcal):\/\//i.test(url)) { $('calMsg').textContent = t('calBadUrl'); return; }
  const cals = settings.calendars = settings.calendars || [];
  const name = $('calName').value.trim() || t('calDefaultName', cals.length + 1);
  cals.push({ id: uid(), name, url, color: CAL_COLORS[cals.length % CAL_COLORS.length], enabled: true });
  $('calName').value = ''; $('calUrl').value = '';
  $('calMsg').textContent = t('calFetching');
  persist(); renderCalSettings();
  setCalendar(await window.planner.calendarRefresh());
  const st = calStatus[cals[cals.length - 1].id];
  $('calMsg').textContent = st && st.ok ? t('calAdded', st.count) : t('calFailed', st ? st.error : t('unknownError'));
  render();
}

function persist() {
  window.planner.saveTodos(todos);
  window.planner.saveSettings({ ...settings, routines, routineDone });
}

/* A routine counts on a date if it existed then, wasn't deleted yet, and is scheduled that weekday. */
function routinesFor(key) {
  const dow = parseKey(key).getDay();
  return routines.filter((r) =>
    (!r.createdAt || r.createdAt <= key) && (!r.deletedAt || key < r.deletedAt) &&
    (!r.days || r.days.length === 0 || r.days.includes(dow))).slice().sort(byTime);
}
const activeRoutines = () => routines.filter((r) => !r.deletedAt);

function dayStat(key) {
  const rs = routinesFor(key);
  const doneIds = routineDone[key] || [];
  const rDone = rs.filter((r) => doneIds.includes(r.id)).length;
  const ts = todos[key] || [];
  const tDone = ts.filter((t) => t.done).length;
  const total = rs.length + ts.length, done = rDone + tDone;
  return { rTotal: rs.length, rDone, tTotal: ts.length, tDone, total, done, pct: total ? done / total : 0 };
}
const heatColor = (k) => {
  if (k > today || k < settings.startDate) return 'var(--line)';
  const s = dayStat(k);
  if (!s.total) return 'var(--line)';
  if (s.done === s.total) return 'var(--accent)';
  return `rgba(var(--accent-rgb), ${0.12 + s.pct * 0.6})`;
};

/* ---------- day view ---------- */
function renderTitle() {
  if (view === 'month') { const y = bigMonth.getFullYear(); $('title').textContent = t('monthTitle', y, bigMonth.getMonth(), y !== new Date().getFullYear()); return; }
  const d = parseKey(selected);
  $('title').textContent = t('dayTitle', d, DOW[d.getDay()]);
}

function renderDay() {
  const s = dayStat(selected);
  const C = 2 * Math.PI * 27;
  $('ringFg').style.strokeDasharray = C;
  $('ringFg').style.strokeDashoffset = C * (1 - s.pct);
  $('ringTxt').textContent = `${Math.round(s.pct * 100)}%`;
  const diff = Math.round((parseKey(selected) - parseKey(today)) / 86400000);
  const when = t('when', diff);
  $('sumTitle').textContent = !s.total ? t('sumEmpty', when) : s.done === s.total ? t('sumAll', when) : t('sumLeft', when, s.total - s.done);
  $('sumSub').textContent = t('sumSub', s.rDone, s.rTotal, s.tDone, s.tTotal);

  // fixed routines
  $('rCount').textContent = s.rTotal ? `${s.rDone}/${s.rTotal}` : '';
  $('rBar').style.width = s.rTotal ? `${(s.rDone / s.rTotal) * 100}%` : '0';
  $('rEditBtn').textContent = editingRoutines ? t('done') : t('edit');
  $('routineEditor').hidden = !editingRoutines;
  const list = editingRoutines ? activeRoutines().slice().sort(byTime) : routinesFor(selected);
  const doneIds = routineDone[selected] || [];
  const rl = $('routineList');
  rl.innerHTML = list.length ? list.map((r) => {
    const dayTxt = r.days && r.days.length ? r.days.slice().sort().map((i) => DOW[i]).join(LANG === 'ko' ? '' : ' ') : t('everyDay');
    const done = !editingRoutines && doneIds.includes(r.id);
    return `<div class="item${done ? ' done' : ''}" data-rid="${r.id}">
      ${editingRoutines ? '' : `<span class="check round" data-act="toggle">${CHECK}</span>`}
      ${r.time ? `<span class="time">${r.time}</span>` : ''}
      <span class="txt" data-act="edit">${esc(r.text)}</span>
      <span class="days">${dayTxt}</span>
      ${editingRoutines ? `<button class="del" data-act="del" title="${t('del')}">✕</button>` : ''}</div>`;
  }).join('') : `<div class="empty">${editingRoutines ? t('routinesEmptyEdit') : t('routinesEmpty')}</div>`;

  rl.querySelectorAll('.item[data-rid]').forEach((row) => {
    const id = row.dataset.rid;
    const r = routines.find((x) => x.id === id);
    const tg = row.querySelector('[data-act=toggle]');
    if (tg) tg.onclick = () => {
      const arr = routineDone[selected] || [];
      routineDone[selected] = arr.includes(id) ? arr.filter((x) => x !== id) : [...arr, id];
      if (!routineDone[selected].length) delete routineDone[selected];
      persist(); render();
    };
    const del = row.querySelector('[data-act=del]');
    if (del) del.onclick = () => {
      // Keep the history: a routine that was ever checked is retired from today on, not erased.
      const used = Object.values(routineDone).some((ids) => ids.includes(id));
      if (used || (r.createdAt && r.createdAt < today)) r.deletedAt = today; else routines = routines.filter((x) => x.id !== id);
      persist(); render();
    };
    row.querySelector('[data-act=edit]').ondblclick = () => startEdit(row, (r.time ? r.time + ' ' : '') + r.text, (v) => Object.assign(r, splitTime(v)));
  });

  $('dayPick').innerHTML = DOW.map((n, i) => `<button data-i="${i}" class="${newRoutineDays.includes(i) ? 'on' : ''}">${n}</button>`).join('');
  $('dayPick').querySelectorAll('button').forEach((b) => b.onclick = () => {
    const i = +b.dataset.i;
    newRoutineDays = newRoutineDays.includes(i) ? newRoutineDays.filter((x) => x !== i) : [...newRoutineDays, i];
    renderDay();
  });

  // today's (changeable) to-dos
  $('tCount').textContent = s.tTotal ? `${s.tDone}/${s.tTotal}` : '';
  $('tBar').style.width = s.tTotal ? `${(s.tDone / s.tTotal) * 100}%` : '0';
  const items = (todos[selected] || []).slice().sort(byTime);
  const tl = $('todoList');
  tl.innerHTML = items.length ? items.map((it) => `<div class="item${it.done ? ' done' : ''}" data-id="${it.id}">
      <span class="check" data-act="toggle">${CHECK}</span>
      ${it.time ? `<span class="time">${it.time}</span>` : ''}
      <span class="txt" data-act="edit">${esc(it.text)}</span>
      <button class="del" data-act="del" title="${t('del')}">✕</button></div>`).join('')
    : `<div class="empty">${t('todosEmpty')}</div>`;
  tl.querySelectorAll('.item[data-id]').forEach((row) => {
    const id = row.dataset.id;
    const t = todos[selected].find((x) => x.id === id);
    row.querySelector('[data-act=toggle]').onclick = () => { t.done = !t.done; persist(); render(); };
    row.querySelector('[data-act=del]').onclick = () => {
      todos[selected] = todos[selected].filter((x) => x.id !== id);
      if (!todos[selected].length) delete todos[selected];
      persist(); render();
    };
    row.querySelector('[data-act=edit]').ondblclick = () => startEdit(row, (t.time ? t.time + ' ' : '') + t.text, (v) => Object.assign(t, splitTime(v)));
  });

  // calendar events for this day (read-only)
  const evs = eventsOn(selected);
  $('calSec').hidden = !evs.length;
  const now = new Date(), nowHM = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  $('evList').innerHTML = evs.map((e) => {
    const past = selected < today || (selected === today && !e.allDay && (e.endTime || e.time) < nowHM);
    return `<div class="ev${past ? ' past' : ''}" title="${t('evTip')}"><i class="cb" style="background:${calColor(e.cal)}"></i><span class="et">${evTime(e)}</span><span class="en">${esc(e.title)}</span></div>`;
  }).join('');
}

function startEdit(row, text, apply) {
  const span = row.querySelector('.txt');
  const input = document.createElement('input');
  input.className = 'edit'; input.value = text; input.maxLength = 120;
  span.replaceWith(input);
  row.querySelector('.time')?.remove();
  input.focus(); input.select();
  let finished = false;
  const finish = (ok) => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (ok && v) { apply(v); persist(); }
    render();
  };
  input.onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) finish(true); if (e.key === 'Escape') finish(false); };
  input.onblur = () => finish(true);
}

/* ---------- mini calendar + upcoming ---------- */
function renderSide() {
  const y = miniMonth.getFullYear(), m = miniMonth.getMonth();
  $('mTitle').textContent = t('miniTitle', y, m);
  const first = new Date(y, m, 1);
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  let html = DOW.map((n, i) => `<div class="dw${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${LANG === 'ko' ? n : n.slice(0, 2)}</div>`).join('');
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(y, m, 1 - first.getDay() + i);
    const k = keyOf(d);
    const st = k <= today && k >= settings.startDate ? dayStat(k) : null;
    const full = st && st.total && st.done === st.total;
    const bg = heatColor(k);
    const fg = full || (st && st.pct > 0.5) ? '#fff' : 'inherit';
    html += `<div class="md${d.getMonth() !== m ? ' other' : ''}${k === today ? ' today' : ''}${k === selected ? ' sel' : ''}${full ? ' full' : ''}" data-k="${k}" style="background:${bg === 'var(--line)' ? 'transparent' : bg};color:${fg}">${d.getDate()}</div>`;
  }
  $('mgrid').innerHTML = html;
  $('mgrid').querySelectorAll('.md').forEach((c) => c.onclick = () => { selected = c.dataset.k; render(); });

  const ups = [];
  for (let i = 1; i <= 14 && ups.length < 10; i++) {
    const k = addDays(today, i);
    const dayItems = [
      ...eventsOn(k).map((e) => ({ sort: e.allDay ? '' : e.time, html: `<i class="dot" style="background:${calColor(e.cal)}"></i>${e.allDay ? '' : e.time + ' '}${esc(e.title)}` })),
      ...(todos[k] || []).filter((t) => !t.done).map((t) => ({ sort: t.time || '99', html: `${t.time ? t.time + ' ' : ''}${esc(t.text)}` })),
    ].sort((a, b) => a.sort.localeCompare(b.sort));
    dayItems.forEach((it) => ups.push([k, it]));
  }
  $('upList').innerHTML = ups.length ? ups.slice(0, 10).map(([k, it]) => {
    const d = parseKey(k);
    return `<div class="up"><span>${d.getMonth() + 1}/${d.getDate()} (${DOW[d.getDay()]})</span><span>${it.html}</span></div>`;
  }).join('') : `<div class="empty" style="padding:0">${t('upEmpty')}</div>`;
}

/* ---------- month view ---------- */
function renderMonth() {
  const y = bigMonth.getFullYear(), m = bigMonth.getMonth();
  const first = new Date(y, m, 1);
  const weeks = Math.ceil((first.getDay() + new Date(y, m + 1, 0).getDate()) / 7);
  const grid = $('grid');
  grid.innerHTML = '';
  grid.style.gridTemplateRows = `repeat(${weeks}, 1fr)`;
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(y, m, 1 - first.getDay() + i);
    const k = keyOf(d);
    const cell = document.createElement('div');
    cell.className = 'cell' + (d.getMonth() !== m ? ' other' : '') + (d.getDay() === 0 ? ' sun' : d.getDay() === 6 ? ' sat' : '') + (k === today ? ' today' : '');
    const st = dayStat(k);
    const showPct = st.total && k <= today && k >= settings.startDate;
    cell.innerHTML = `<div class="top"><div class="num">${d.getDate() === 1 ? `${d.getMonth() + 1}.1` : d.getDate()}</div>${showPct ? `<span class="pct${st.done === st.total ? ' full' : ''}">${Math.round(st.pct * 100)}%</span>` : ''}</div>`;
    const lines = [
      ...eventsOn(k).map((e) => ({ done: false, color: calColor(e.cal), text: `${e.allDay ? '' : e.time + ' '}${e.title}` })),
      ...(todos[k] || []).slice().sort(byTime).map((t) => ({ done: t.done, color: '', text: `${t.time ? t.time + ' ' : ''}${t.text}` })),
    ];
    lines.slice(0, 3).forEach((t) => {
      const el = document.createElement('div');
      el.className = 'mini' + (t.done ? ' done' : '');
      el.innerHTML = `<i class="b"${t.color ? ` style="background:${t.color}"` : ''}></i><span>${esc(t.text)}</span>`;
      cell.appendChild(el);
    });
    if (lines.length > 3) { const more = document.createElement('div'); more.className = 'more'; more.textContent = t('more', lines.length - 3); cell.appendChild(more); }
    cell.onclick = () => { selected = k; miniMonth = new Date(d.getFullYear(), d.getMonth(), 1); setView('day'); };
    grid.appendChild(cell);
  }
}

/* ---------- dashboard ---------- */
function setDash(open) {
  if (open) renderDash();
  $('dash').classList.toggle('open', open);
  $('dashToggle').classList.toggle('on', open);
  $('dashToggle').setAttribute('aria-checked', String(open));
}
const openDash = () => setDash(true);
const closeDash = () => setDash(false);

function renderDash() {
  const start = settings.startDate;
  const sd = parseKey(start);
  $('dashSince').textContent = t('since', sd.getFullYear(), sd.getMonth() + 1, sd.getDate());

  // streaks: a day "counts" when it had something to do and all of it was done.
  const isFull = (k) => { const s = dayStat(k); return s.total > 0 && s.done === s.total; };
  const hasWork = (k) => dayStat(k).total > 0;
  let streak = 0;
  let k = isFull(today) ? today : addDays(today, -1);
  while (k >= start) { if (!hasWork(k)) { k = addDays(k, -1); continue; } if (!isFull(k)) break; streak++; k = addDays(k, -1); }
  let best = 0, run = 0;
  for (let c = start; c <= today; c = addDays(c, 1)) { if (!hasWork(c)) continue; if (isFull(c)) { run++; best = Math.max(best, run); } else run = 0; }

  const last30 = [];
  for (let i = 29; i >= 0; i--) last30.push(addDays(today, -i));
  const counted = last30.filter((x) => x >= start && hasWork(x));
  const avg = counted.length ? counted.reduce((a, x) => a + dayStat(x).pct, 0) / counted.length : 0;
  const fullDays = counted.filter(isFull).length;

  const du = t('daysUnit');
  $('sStreak').innerHTML = `${streak}<small>${du}</small>`;
  $('sBest').innerHTML = `${best}<small>${du}</small>`;
  $('sAvg').innerHTML = `${Math.round(avg * 100)}<small>%</small>`;
  $('sFull').innerHTML = `${fullDays}<small>${du}</small>`;

  // 30-day bar chart
  const W = 760, H = 150, padL = 30, padB = 20, bw = (W - padL) / 30;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block;height:${H}px">`;
  [0, 50, 100].forEach((v) => {
    const yy = (H - padB) - (H - padB - 8) * v / 100;
    svg += `<line x1="${padL}" x2="${W}" y1="${yy}" y2="${yy}" stroke="currentColor" stroke-opacity=".12"/><text x="${padL - 6}" y="${yy + 3}" text-anchor="end">${v}%</text>`;
  });
  last30.forEach((x, i) => {
    const s = dayStat(x);
    const valid = x >= start && s.total;
    const h = valid ? Math.max(2, (H - padB - 8) * s.pct) : 0;
    const xx = padL + i * bw + bw * 0.18;
    const d = parseKey(x);
    const fill = valid && s.done === s.total ? 'var(--accent)' : 'rgba(var(--accent-rgb), .45)';
    if (valid) svg += `<rect x="${xx}" y="${H - padB - h}" width="${bw * 0.64}" height="${h}" rx="3" fill="${fill}" data-tip="${d.getMonth() + 1}/${d.getDate()} · ${t('doneOf', s.done, s.total)} (${Math.round(s.pct * 100)}%)"/>`;
    if (i % 5 === 4 || i === 29) svg += `<text x="${xx + bw * 0.32}" y="${H - 5}" text-anchor="middle">${d.getMonth() + 1}/${d.getDate()}</text>`;
  });
  svg += '</svg>';
  $('chart30').innerHTML = svg;

  // 20-week heatmap (columns = weeks, rows = Sun..Sat)
  const end = parseKey(today);
  const startH = new Date(end); startH.setDate(end.getDate() - end.getDay() - 7 * 19);
  let heat = '';
  for (let i = 0; i < 140; i++) {
    const d = new Date(startH); d.setDate(startH.getDate() + i);
    const kk = keyOf(d);
    const s = dayStat(kk);
    const tip = kk > today ? '' : `${d.getMonth() + 1}/${d.getDate()} · ${kk < start || !s.total ? t('noRecord') : t('doneOf', s.done, s.total)}`;
    heat += `<i style="background:${heatColor(kk)};${kk > today ? 'opacity:.3' : ''}" data-tip="${tip}"></i>`;
  }
  $('heat').innerHTML = heat;

  // per-routine completion (last 30 days, only days it was scheduled)
  const rows = activeRoutines().map((r) => {
    let sched = 0, done = 0;
    last30.forEach((x) => {
      if (x < start) return;
      if (!routinesFor(x).some((y) => y.id === r.id)) return;
      sched++; if ((routineDone[x] || []).includes(r.id)) done++;
    });
    return { r, sched, done, pct: sched ? done / sched : 0 };
  }).sort((a, b) => b.pct - a.pct);
  $('perRoutine').innerHTML = rows.length ? rows.map(({ r, sched, done, pct }) =>
    `<div class="rrow" data-tip="${t('routineDays', done, sched)}"><span class="t">${esc(r.text)}</span><div class="track"><div style="width:${pct * 100}%"></div></div><span class="v">${Math.round(pct * 100)}%</span></div>`).join('')
    : `<div class="empty" style="padding:0">${t('perRoutineEmpty')}</div>`;
}

// tooltips for charts
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  const tip = $('tip');
  if (t && t.dataset.tip) { tip.textContent = t.dataset.tip; tip.style.display = 'block'; tip.style.left = `${e.clientX + 12}px`; tip.style.top = `${e.clientY + 12}px`; }
  else tip.style.display = 'none';
});

/* ---------- render ---------- */
function render() {
  const nowKey = keyOf(new Date());
  if (nowKey !== today) { if (selected === today) selected = nowKey; today = nowKey; }
  renderTitle();
  if (view === 'day') { renderDay(); renderSide(); } else renderMonth();
  if ($('dash').classList.contains('open')) renderDash();
  renderCalSettings();
  renderGoogle();
  applySettings();
}
function setView(v) {
  view = v;
  if (v !== 'day') closeDash();
  $('vDay').classList.toggle('on', v === 'day');
  $('vMonth').classList.toggle('on', v === 'month');
  $('dayView').hidden = v !== 'day';
  $('side').hidden = v !== 'day';
  $('monthView').hidden = v !== 'month';
  render();
}

/* ---------- input handling ---------- */
function addTodo() {
  const v = $('tInput').value.trim();
  if (!v) return;
  $('tInput').value = '';
  const { time, text } = splitTime(v);
  (todos[selected] = todos[selected] || []).push({ id: uid(), text, time, done: false });
  persist(); render(); $('tInput').focus();
}
function addRoutine() {
  const v = $('rInput').value.trim();
  if (!v) return;
  $('rInput').value = '';
  const { time, text } = splitTime(v);
  routines.push({ id: uid(), text, time, days: newRoutineDays.slice(), createdAt: today });
  newRoutineDays = [];
  persist(); render(); $('rInput').focus();
}
$('tAdd').onclick = addTodo;
$('tInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) addTodo(); };
$('rAdd').onclick = addRoutine;
$('rInput').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) addRoutine(); };
$('rEditBtn').onclick = () => { editingRoutines = !editingRoutines; renderDay(); };

$('prev').onclick = () => {
  if (view === 'month') bigMonth = new Date(bigMonth.getFullYear(), bigMonth.getMonth() - 1, 1);
  else { selected = addDays(selected, -1); miniMonth = parseKey(selected); }
  render();
};
$('next').onclick = () => {
  if (view === 'month') bigMonth = new Date(bigMonth.getFullYear(), bigMonth.getMonth() + 1, 1);
  else { selected = addDays(selected, 1); miniMonth = parseKey(selected); }
  render();
};
$('mPrev').onclick = () => { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() - 1, 1); renderSide(); };
$('mNext').onclick = () => { miniMonth = new Date(miniMonth.getFullYear(), miniMonth.getMonth() + 1, 1); renderSide(); };
$('goToday').onclick = () => { selected = today; miniMonth = new Date(); bigMonth = new Date(); render(); };
$('vDay').onclick = () => setView('day');
$('vMonth').onclick = () => setView('month');
$('dashClose').onclick = closeDash;
$('dashToggle').onclick = () => setDash(!$('dash').classList.contains('open'));
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('help').hidden) closeHelp(); closeDash(); $('pop').classList.remove('open'); } });
$('helpBtn').onclick = (e) => { e.stopPropagation(); showHelp(); };
$('helpX').onclick = closeHelp;
$('helpOk').onclick = closeHelp;
$('help').addEventListener('click', (e) => { if (e.target === $('help')) closeHelp(); });
document.addEventListener('click', (e) => {
  const a = e.target.closest && e.target.closest('[data-link]');
  if (!a) return;
  e.preventDefault();
  const key = a.dataset.link === 'guide' ? (LANG === 'ko' ? 'guideKo' : 'guideEn') : a.dataset.link;
  window.planner.openLink(key);
});

$('lockBtn').onclick = () => { settings.locked = !settings.locked; persist(); applySettings(); };
$('setBtn').onclick = (e) => { e.stopPropagation(); $('pop').classList.toggle('open'); };
document.addEventListener('click', (e) => {
  // ignore clicks on elements that were re-rendered away (e.g. the ✕ of a removed calendar)
  if (!$('pop').contains(e.target) && document.contains(e.target)) $('pop').classList.remove('open');
});
$('calAdd').onclick = addCalendar;
$('calUrl').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) addCalendar(); };
$('calRefresh').onclick = async () => {
  $('calMsg').textContent = t('calRefreshing');
  setCalendar(await window.planner.calendarRefresh());
  const bad = (settings.calendars || []).filter((c) => calStatus[c.id] && !calStatus[c.id].ok).length;
  $('calMsg').textContent = !(settings.calendars || []).length ? t('calNone') : bad ? t('calSomeFailed', bad) : t('calUpdated');
  render();
};
$('opacity').oninput = (e) => { settings.opacity = +e.target.value; applySettings(); persist(); };
$('lightInk').onclick = () => { settings.dark = false; applySettings(); persist(); };
$('darkInk').onclick = () => { settings.dark = true; applySettings(); persist(); };
$('blurOn').onclick = () => { settings.blur = true; applySettings(); persist(); };
$('blurOff').onclick = () => { settings.blur = false; applySettings(); persist(); };
const setLang = (l) => { settings.lang = l; applyLang(); persist(); render(); };
$('langKo').onclick = () => setLang('ko');
$('langEn').onclick = () => setLang('en');
$('rollover').onclick = () => {
  let moved = 0;
  Object.keys(todos).filter((k) => k < today).forEach((k) => {
    const open = todos[k].filter((t) => !t.done);
    if (!open.length) return;
    todos[k] = todos[k].filter((t) => t.done);
    if (!todos[k].length) delete todos[k];
    (todos[today] = todos[today] || []).push(...open);
    moved += open.length;
  });
  $('rollover').textContent = moved ? t('rolled', moved) : t('nothingToRoll');
  setTimeout(() => { $('rollover').textContent = t('rollover'); }, 2000);
  selected = today; persist(); render();
};

function applySettings() {
  document.documentElement.style.setProperty('--bg-a', settings.opacity);
  document.body.classList.toggle('dark', !!settings.dark);
  document.body.classList.toggle('unlocked', !settings.locked);
  document.body.classList.toggle('noblur', settings.blur === false);
  $('lockBtn').innerHTML = settings.locked ? LOCK : UNLOCK;
  $('lockBtn').classList.toggle('lock-on', !!settings.locked);
  $('lockBtn').title = settings.locked ? t('unlock') : t('lock');
  $('opacity').value = settings.opacity;
  $('lightInk').classList.toggle('on', !settings.dark);
  $('darkInk').classList.toggle('on', !!settings.dark);
  $('blurOn').classList.toggle('on', settings.blur !== false);
  $('blurOff').classList.toggle('on', settings.blur === false);}

window.planner.onSettings((s) => { settings = { ...settings, ...s }; delete settings.routines; delete settings.routineDone; applySettings(); });

const wall = $('wall');
window.planner.onWallpaper((url) => { wall.style.backgroundImage = url ? `url("${url}")` : 'none'; });
window.planner.onGeometry(({ win, display }) => {
  wall.style.left = `${display.x - win.x}px`;
  wall.style.top = `${display.y - win.y}px`;
  wall.style.width = `${display.width}px`;
  wall.style.height = `${display.height}px`;
});

setInterval(() => { if (keyOf(new Date()) !== today) render(); }, 60 * 1000);

window.planner.load().then(async (d) => {
  todos = d.todos || {};
  settings = d.settings || {};
  routines = settings.routines || [];
  routineDone = settings.routineDone || {};
  delete settings.routines; delete settings.routineDone;
  if (!settings.startDate) {
    // Record-keeping starts at the first day with data, or today for a fresh install.
    const keys = [...Object.keys(todos), ...Object.keys(routineDone)].sort();
    settings.startDate = keys[0] && keys[0] < today ? keys[0] : today;
  }
  routines.forEach((r) => { if (!r.createdAt) r.createdAt = settings.startDate; if (r.time === undefined) Object.assign(r, splitTime(r.text)); });
  Object.values(todos).forEach((list) => list.forEach((t) => { if (t.time === undefined) Object.assign(t, splitTime(t.text)); }));
  applyLang();
  persist();
  setCalendar(await window.planner.calendarGet());
  render();
  window.planner.appInfo().then((i) => { $('verTxt').textContent = 'v' + i.version; });
  const open = new URLSearchParams(location.search).get('open');
  if (open === 'dash') openDash();
  if (open === 'settings') $('pop').classList.add('open');
  if (open === 'month') setView('month');
  if (open === 'edit') { editingRoutines = true; renderDay(); }
  // First launch (or opened for screenshots): show the quick guide once.
  if (open === 'help' || (!open && !settings.onboarded)) showHelp();
});
window.planner.onCalendar((p) => { setCalendar(p); render(); });
</script>
</body>
