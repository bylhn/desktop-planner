name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tests need no packages: Google calls are faked, and the UI tests drive the web demo
      # (docs/demo, rebuilt here from index.html) in the runner's Chrome.
      - name: Build the web demo
        run: npm run demo
      - name: Run tests
        run: npm test
        env:
          CHROME_PATH: /usr/bin/google-chrome
